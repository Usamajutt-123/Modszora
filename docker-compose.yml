services:
  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file: apps/agent/.env
    ports: ["8787:8787"]
    restart: unless-stopped
    # Playwright needs more than Docker's default 64MB /dev/shm
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
